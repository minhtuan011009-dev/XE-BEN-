    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw !== null ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSave(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        // Ignore storage restrictions
      }
    }

    function initSiteState() {
      SITE_STATE.soundEnabled = Boolean(safeLoad("math12_site_sound", true));
      const savedAns = safeLoad("math12_site_inspections", {});
      if (savedAns && typeof savedAns === "object") {
        SITE_STATE.inspectionAnswers = savedAns;
      }
      updateSoundIcons();
    }

    // =========================================================================
    // KATEX & LUCIDE RENDER HELPERS
    // =========================================================================
    function renderMath(container) {
      const el = container || document.getElementById("main-workspace");
      if (!el || typeof renderMathInElement !== "function") return;
      try {
        renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      } catch (err) {
        console.warn("KaTeX warning:", err);
      }
    }

    function renderIcons() {
      if (typeof lucide !== "undefined" && lucide.createIcons) {
        lucide.createIcons();
      }
    }

    // =========================================================================
    // WEB AUDIO API: "TING" CHÚC MỪNG NGHIỆM THU ĐẠT
    // =========================================================================
    let siteAudioCtx = null;
    function playInspectionSound(passed) {
      if (!SITE_STATE.soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!siteAudioCtx) siteAudioCtx = new AudioCtx();
        if (siteAudioCtx.state === "suspended") siteAudioCtx.resume();

        const now = siteAudioCtx.currentTime;
        const osc = siteAudioCtx.createOscillator();
        const gain = siteAudioCtx.createGain();
        osc.connect(gain);
        gain.connect(siteAudioCtx.destination);

        if (passed) {
          // Crisp "Ting-Ting" chime
          osc.type = "sine";
          osc.frequency.setValueAtTime(659.25, now); // E5
          osc.frequency.exponentialRampToValueAtTime(987.77, now + 0.11); // B5
          osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.25); // E6
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.42);
        } else {
          // Low buzzer warning
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.22);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {
        // Ignore audio errors
      }
    }

        amber: "bg-slate-900/95 border-amber-500 text-amber-300"
      };
      item.className = `pointer-events-auto px-4 py-2.5 rounded-lg border-l-4 border text-xs font-mono font-bold uppercase tracking-wide shadow-xl transition-all duration-300 ${
        colorMap[status] || colorMap.amber
      }`;
      item.textContent = msg;
      box.appendChild(item);
      setTimeout(() => {
        item.style.opacity = "0";
        item.style.transform = "translateY(6px)";
        setTimeout(() => item.remove(), 260);
      }, 2200);
    }

    function toggleSound() {
      SITE_STATE.soundEnabled = !SITE_STATE.soundEnabled;
      safeSave("math12_site_sound", SITE_STATE.soundEnabled);
      updateSoundIcons();
      showSiteToast(
        SITE_STATE.soundEnabled ? "🔊 ĐÃ BẬT CÒI NGHIỆM THU HIỆN TRƯỜNG" : "🔇 ĐÃ TẮT ÂM THANH",
        "amber"
      );
    }

    function updateSoundIcons() {
      const iconName = SITE_STATE.soundEnabled ? "volume-2" : "volume-x";
      const d = document.getElementById("sound-icon-desktop");
      const m = document.getElementById("sound-icon-mobile");
      if (d) d.setAttribute("data-lucide", iconName);
      if (m) m.setAttribute("data-lucide", iconName);
      renderIcons();
    }

    function resetSiteProgress() {
      SITE_STATE.inspectionAnswers = {};
      safeSave("math12_site_inspections", {});
      renderAll();
      showSiteToast("ĐÃ ĐẶT LẠI TOÀN BỘ HỒ SƠ NGHIỆM THU CÔNG TRÌNH", "amber");
    }

    // =========================================================================
    // PROGRESS & PIPELINE NAVIGATION BAR
    // =========================================================================
    function getStageInspectionStats(stage) {
      let passed = 0;
      let answered = 0;
      const total = stage.inspections.length;
      stage.inspections.forEach((ins) => {
        const chosen = SITE_STATE.inspectionAnswers[ins.code];
        if (chosen !== undefined) {
          answered++;
          if (chosen === ins.correctIndex) passed++;
        }
      });
      return { passed, answered, total };
    }

    function updateGlobalProgressUI() {
      let totalItems = 0;
      let passedItems = 0;
      CONSTRUCTION_SITE_DATA.stages.forEach((st) => {
        const s = getStageInspectionStats(st);
        totalItems += s.total;
        passedItems += s.passed;
      });
      const pct = totalItems > 0 ? Math.round((passedItems / totalItems) * 100) : 0;
      const pctEl = document.getElementById("site-progress-pct");
      const barEl = document.getElementById("site-progress-bar");
      if (pctEl) pctEl.textContent = `${pct}% (${passedItems}/${totalItems} ĐẠT)`;
      if (barEl) barEl.style.width = `${pct}%`;
    }

    function renderPipelineNav() {
      const nav = document.getElementById("pipeline-nav");
      if (!nav) return;

      const isMaster = SITE_STATE.activeView === "master";

      const masterBtn = `
        <button
          type="button"
          onclick="switchSiteView('master')"
          class="px-3.5 py-2 rounded-lg font-mono text-xs font-extrabold uppercase tracking-wider border transition flex items-center gap-2 ${
            isMaster
              ? "bg-amber-500 text-slate-950 border-amber-300 shadow-md shadow-amber-500/20"
              : "bg-slate-900 text-slate-300 border-slate-800 hover:border-amber-500/50 hover:text-amber-300"
          }"
        >
          <i data-lucide="map" class="w-4 h-4"></i>
          <span>[Tổng quan Công trình]</span>
        </button>
      `;

      const stageBtns = CONSTRUCTION_SITE_DATA.stages
        .map((st, idx) => {
          const isActive = SITE_STATE.activeView === st.id;
          const stats = getStageInspectionStats(st);
          const isAllPassed = stats.passed === stats.total;

          const connector = `
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600 shrink-0"></i>
          `;

          const statusBadge = isAllPassed
            ? `<span class="px-1.5 py-0.5 rounded-xs text-[10px] font-mono font-black bg-emerald-500 text-slate-950">ĐẠT ${stats.passed}/${stats.total}</span>`
            : `<span class="px-1.5 py-0.5 rounded-xs text-[10px] font-mono font-bold ${
                isActive ? "bg-slate-950/30 text-slate-950" : "bg-slate-800 text-slate-400"
              }">${stats.passed}/${stats.total}</span>`;

          return `
            ${connector}
            <button
              type="button"
              onclick="switchSiteView('${st.id}')"
              class="px-3.5 py-2 rounded-lg font-mono text-xs font-bold uppercase tracking-wide border transition flex items-center gap-2 ${
                isActive
                  ? "bg-amber-500 text-slate-950 border-amber-300 shadow-md shadow-amber-500/20 font-extrabold"
                  : isAllPassed
                  ? "bg-emerald-950/40 text-emerald-300 border-emerald-500/40 hover:border-emerald-400"
                  : "bg-slate-900 text-slate-300 border-slate-800 hover:border-amber-500/50 hover:text-amber-300"
              }"
            >
              <span>[Công đoạn ${idx + 1}: ${st.name}]</span>
              ${statusBadge}
            </button>
          `;
        })
        .join("");

      nav.innerHTML = masterBtn + stageBtns;
      updateGlobalProgressUI();
      renderIcons();
    }

    function switchSiteView(viewId) {
      SITE_STATE.activeView = viewId;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =========================================================================
    // SCREEN 1: MASTER BLUEPRINT (SƠ ĐỒ QUY HOẠCH MẶT BẰNG TỔNG QUAN)
    // =========================================================================
    function renderMasterBlueprintView() {
      const bp = CONSTRUCTION_SITE_DATA.masterBlueprint;

      // Top Construction Pipeline Flow Banner (5 steps connected by arrows)
      const flowStepsHTML = bp.children
        .map((node, index) => {
          const stageObj = CONSTRUCTION_SITE_DATA.stages.find((s) => s.id === node.stageId);
          const stats = stageObj ? getStageInspectionStats(stageObj) : { passed: 0, total: 2 };
          const isDone = stats.passed === stats.total;

          const arrowHTML =
            index < bp.children.length - 1
              ? `
                <div class="hidden lg:flex items-center justify-center text-amber-400 px-1">
                  <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </div>
              `
              : "";

          return `
            <div
              onclick="switchSiteView('${node.stageId}')"
              class="cursor-pointer flex-1 min-w-[180px] p-3.5 rounded-xl bg-slate-900/90 border-2 ${
                isDone ? "border-emerald-500/60" : "border-sky-500/40 hover:border-amber-400"
              } transition group relative"
            >
              <div class="flex items-center justify-between text-[10px] font-mono font-bold uppercase mb-1">
                <span class="text-amber-400">${node.code}</span>
                <span class="${isDone ? "text-emerald-400" : "text-sky-400"}">
                  ${isDone ? "✓ ĐÃ NGHIỆM THU" : `QC ${stats.passed}/${stats.total}`}
                </span>
              </div>
              <div class="text-xs sm:text-sm font-extrabold text-white group-hover:text-amber-300 transition">
                ${node.shortAction}
              </div>
              <div class="text-[11px] text-slate-400 mt-0.5 truncate">
                Bài ${index + 1} SGK
              </div>
            </div>
            ${arrowHTML}
          `;
        })
        .join("");

      // Interactive Collapsible Master Tree Nodes
      const masterTreeCardsHTML = bp.children
        .map((node, idx) => {
          const isOpen = SITE_STATE.expandedMasterNodes[node.stageId] !== false;
          const stageObj = CONSTRUCTION_SITE_DATA.stages.find((s) => s.id === node.stageId);
          const stats = stageObj ? getStageInspectionStats(stageObj) : { passed: 0, total: 2 };

          const subItemsHTML = node.subNodes
            .map(
              (subText, sIdx) => `
              <div class="p-3 rounded-lg bg-slate-950/85 border border-dashed border-sky-500/40 flex items-start gap-2.5">
                <span class="px-1.5 py-0.5 rounded-xs bg-sky-500/20 text-sky-300 font-mono text-[10px] font-bold shrink-0 mt-0.5">
                  0${idx + 1}.${sIdx + 1}
                </span>
                <div class="text-xs sm:text-sm text-slate-200 leading-relaxed">${subText}</div>
              </div>
            `
            )
            .join("");

          return `
            <div class="tech-card rounded-xl border-2 border-slate-700/90 hover:border-amber-500/60 transition overflow-hidden shadow-lg">
              <!-- Card Header (Click to Collapse/Expand) -->
              <div class="p-4 bg-slate-900/95 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3">
                <div
                  onclick="toggleMasterNode('${node.stageId}')"
                  class="flex items-center gap-3 cursor-pointer select-none flex-1 min-w-[240px]"
                >
                  <button
                    type="button"
                    class="w-8 h-8 rounded-lg bg-amber-500/15 border border-amber-500/40 text-amber-400 flex items-center justify-center shrink-0"
                    aria-label="Mở rộng hoặc thu gọn nhánh"
                  >
                    <i
                      id="master-chevron-${node.stageId}"
                      data-lucide="chevron-down"
                      class="w-4 h-4 transition-transform duration-200"
                      style="transform: ${isOpen ? "rotate(0deg)" : "rotate(-90deg)"}"
                    ></i>
                  </button>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded-xs text-[10px] font-mono font-extrabold bg-amber-500 text-slate-950 uppercase">
                        ${node.code}
                      </span>
                      <span class="text-xs font-mono text-sky-400 font-semibold">
                        [${node.shortAction}]
                      </span>
                    </div>
                    <h3 class="text-sm sm:text-base font-extrabold text-white mt-1">
                      ${node.title}
                    </h3>
                  </div>
                </div>

                <!-- Right Actions: Formula Preview & Direct Enter Stage Button -->
                <div class="flex items-center gap-2.5">
                  <span class="px-2.5 py-1 rounded-md text-xs font-mono font-bold bg-slate-950 border border-slate-800 text-emerald-400">
                    Nghiệm thu: ${stats.passed}/${stats.total}
                  </span>
                  <button
                    type="button"
                    onclick="switchSiteView('${node.stageId}')"
                    class="px-3.5 py-2 rounded-lg bg-orange-600 hover:bg-orange-500 text-white font-mono text-xs font-extrabold uppercase tracking-wider transition flex items-center gap-1.5 shadow-md"
                  >
                    <span>Vào Công đoạn ${idx + 1}</span>
                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Collapsible Body -->
              <div
                id="master-branch-${node.stageId}"
                class="blueprint-branch p-4 space-y-3 ${isOpen ? "" : "collapsed"}"
                style="max-height: 1200px;"
              >
                <!-- One-line Key Blueprint Formula -->
                <div class="px-4 py-2.5 rounded-lg bg-sky-950/40 border border-sky-500/40 text-sky-100 overflow-x-auto text-xs sm:text-sm">
                  ${node.summaryFormula}
                </div>

                <!-- Sub-branches Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                  ${subItemsHTML}
                </div>
              </div>
            </div>
          `;
        })
        .join("");

      return `
        <div class="space-y-6">
          <!-- Master Blueprint Header Banner -->
          <section class="tech-card rounded-2xl border-2 border-amber-500/60 p-5 sm:p-6 shadow-2xl">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-5 border-b border-dashed border-slate-700">
              <div class="space-y-1.5">
                <div class="inline-flex items-center gap-2 text-xs font-mono font-bold text-amber-400 uppercase tracking-widest">
                  <i data-lucide="compass" class="w-4 h-4"></i>
                  <span>SƠ ĐỒ QUY HOẠCH MẶT BẰNG (MASTER BLUEPRINT)</span>
                </div>
                <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight uppercase">
                  Dây chuyền 5 Công đoạn Thi công Hàm số (Chương 1 - Toán 12)
                </h2>
                <p class="text-xs sm:text-sm text-slate-300">
                  Nhấn vào từng công đoạn trên dây chuyền để mở <strong>Phiếu Kiểm định Kỹ thuật</strong> và thực hiện <strong>Nghiệm thu Hiện trường</strong>.
                </p>
              </div>

              <!-- Expand / Collapse All Master Tree -->
              <div class="flex items-center gap-2 shrink-0">
                <button
                  type="button"
                  onclick="setAllMasterNodes(true)"
                  class="px-3 py-2 rounded-lg bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/50 text-sky-300 font-mono text-xs font-bold uppercase transition flex items-center gap-1.5"
                >
                  <i data-lucide="unfold-vertical" class="w-4 h-4"></i>
                  <span>Mở toàn bộ bản vẽ</span>
                </button>
                <button
                  type="button"
                  onclick="setAllMasterNodes(false)"
                  class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 font-mono text-xs font-bold uppercase transition flex items-center gap-1.5"
                >
                  <i data-lucide="fold-vertical" class="w-4 h-4"></i>
                  <span>Thu gọn</span>
                </button>
              </div>
            </div>

            <!-- 5-Stage Construction Pipeline Diagram -->
            <div class="pt-5">
              <div class="text-[11px] font-mono font-bold uppercase text-slate-400 mb-2.5 flex items-center gap-1.5">
                <i data-lucide="git-commit" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>LUỒNG THI CÔNG LIÊN HOÀN: ĐO ĐỘ DỐC → KIỂM TRA TẢI TRỌNG → DỰNG GIÀN GIÁO → ĐỔ BÊ TÔNG KẾT CẤU → TỐI ƯU DỰ TOÁN</span>
              </div>
              <div class="flex flex-col lg:flex-row items-stretch lg:items-center gap-2.5">
                ${flowStepsHTML}
              </div>
            </div>
          </section>

          <!-- Collapsible Master Tree of All 5 Stages -->
          <section class="space-y-3.5">
            ${masterTreeCardsHTML}
          </section>
        </div>
      `;
    }

    function toggleMasterNode(stageId) {
      const branch = document.getElementById(`master-branch-${stageId}`);
      const icon = document.getElementById(`master-chevron-${stageId}`);
      if (!branch) return;

      const isCurrentlyOpen = !branch.classList.contains("collapsed");
      SITE_STATE.expandedMasterNodes[stageId] = !isCurrentlyOpen;

      if (isCurrentlyOpen) {
        branch.classList.add("collapsed");
        if (icon) icon.style.transform = "rotate(-90deg)";
      } else {
        branch.classList.remove("collapsed");
        if (icon) icon.style.transform = "rotate(0deg)";
      }
    }

    function setAllMasterNodes(open) {
      CONSTRUCTION_SITE_DATA.stages.forEach((st) => {
        SITE_STATE.expandedMasterNodes[st.id] = open;
      });
      renderAll();
    }

    // =========================================================================
    // SCREEN 2: STAGE DETAIL VIEW (CHỈ GỒM 2 KHU VỰC: A. THẺ TƯ DUY & B. NGHIỆM THU)
    // =========================================================================
    function renderStageDetailView(stage) {
      const stats = getStageInspectionStats(stage);

      const badgeStyleMap = {
        amber: {
          border: "border-amber-500/60",
          tagBg: "bg-amber-500 text-slate-950",
          formulaBg: "bg-amber-950/30 border-amber-500/40 text-amber-100"
        },
        orange: {
          border: "border-orange-500/60",
          tagBg: "bg-orange-500 text-white",
          formulaBg: "bg-orange-950/30 border-orange-500/40 text-orange-100"
        },
        sky: {
          border: "border-sky-500/60",
          tagBg: "bg-sky-500 text-slate-950",
          formulaBg: "bg-sky-950/40 border-sky-500/40 text-sky-100"
        },
        emerald: {
          border: "border-emerald-500/60",
          tagBg: "bg-emerald-500 text-slate-950",
          formulaBg: "bg-emerald-950/30 border-emerald-500/40 text-emerald-100"
        }
      };

      // AREA A: SƠ ĐỒ TƯ DUY RÚT GỌN (4 THẺ KIỂM ĐỊNH KỸ THUẬT)
      const flowCardsHTML = stage.flowCards
        .map((card, idx) => {
          const st = badgeStyleMap[card.badgeColor] || badgeStyleMap.amber;
          return `
            <div class="tech-card rounded-xl border-2 ${st.border} p-4 sm:p-5 flex flex-col justify-between gap-3 shadow-lg relative">
              <!-- 4 Corner Rivets -->
              <span class="tech-rivet absolute top-2 left-2"></span>
              <span class="tech-rivet absolute top-2 right-2"></span>
              <span class="tech-rivet absolute bottom-2 left-2"></span>
              <span class="tech-rivet absolute bottom-2 right-2"></span>

              <div class="space-y-2.5 pl-1 pr-1">
                <!-- Card Technical Header -->
                <div class="flex items-center justify-between gap-2">
                  <span class="px-2 py-0.5 rounded-xs font-mono text-[10px] font-black uppercase tracking-wider ${st.tagBg}">
                    ${card.specCode} • ${card.tag}
                  </span>
                  <span class="font-mono text-xs font-bold text-slate-400">
                    [NODE 0${idx + 1}]
                  </span>
                </div>

                <!-- Card Title -->
                <h4 class="text-base sm:text-lg font-extrabold text-white tracking-tight">
                  ${card.title}
                </h4>

                <!-- Crisp 1-line KaTeX Formula Box -->
                <div class="px-3.5 py-2.5 rounded-lg border border-dashed ${st.formulaBg} overflow-x-auto text-xs sm:text-sm">
                  ${card.formula}
                </div>
              </div>

              <!-- Concise 1-line Engineering Note -->
              <div class="pt-2 border-t border-slate-800/90 flex items-center gap-2 text-xs text-slate-300 pl-1 pr-1">
                <i data-lucide="wrench" class="w-3.5 h-3.5 text-amber-400 shrink-0"></i>
                <span>${card.note}</span>
              </div>
            </div>
          `;
        })
        .join("");

      // AREA B: PHIẾU NGHIỆM THU HIỆN TRƯỜNG (2 CÂU TRẮC NGHIỆM THỰC TẾ NHANH)
      const letters = ["A", "B", "C", "D"];
      const inspectionsHTML = stage.inspections
        .map((ins, qIdx) => {
          const chosenIdx = SITE_STATE.inspectionAnswers[ins.code];
          const isAnswered = chosenIdx !== undefined;
          const isPassed = isAnswered && chosenIdx === ins.correctIndex;

          const optionsHTML = ins.options
            .map((opt, oIdx) => {
              let btnClass =
                "bg-slate-900/90 border-slate-700 text-slate-200 hover:border-amber-400 hover:bg-slate-800/90";
              let badgeClass = "bg-slate-800 text-amber-400 border border-slate-600";
              let iconRight = "";

              if (isAnswered) {
                if (oIdx === ins.correctIndex) {
                  btnClass =
                    "bg-emerald-950/80 border-2 border-emerald-400 text-emerald-100 font-bold shadow-md shadow-emerald-500/10";
                  badgeClass = "bg-emerald-500 text-slate-950 font-black";
                  iconRight = `<span class="text-[10px] font-mono font-black uppercase px-2 py-0.5 rounded-xs bg-emerald-500 text-slate-950 shrink-0">ĐẠT CHUẨN ✓</span>`;
                } else if (oIdx === chosenIdx && chosenIdx !== ins.correctIndex) {
                  btnClass = "bg-rose-950/80 border-2 border-rose-500 text-rose-200 font-semibold";
                  badgeClass = "bg-rose-600 text-white font-black";
                  iconRight = `<span class="text-[10px] font-mono font-black uppercase px-2 py-0.5 rounded-xs bg-rose-600 text-white shrink-0">SAI LỆCH ✗</span>`;
                } else {
                  btnClass = "bg-slate-950/50 border-slate-800 text-slate-500 opacity-65";
                }
              }

              return `
                <button
                  type="button"
                  onclick="submitInspection('${stage.id}', '${ins.code}', ${oIdx})"
                  class="w-full text-left p-3.5 rounded-xl border transition-all duration-150 flex items-center justify-between gap-3 ${btnClass}"
                >
                  <div class="flex items-center gap-3 min-w-0">
                    <span class="w-7 h-7 rounded-md font-mono text-xs font-bold flex items-center justify-center shrink-0 ${badgeClass}">
                      ${letters[oIdx]}
                    </span>
                    <span class="text-xs sm:text-sm">${opt}</span>
                  </div>
                  ${iconRight}
                </button>
              `;
            })
            .join("");

          const specExplanationHTML = isAnswered
            ? `
              <div class="mt-3 p-3.5 rounded-xl border-l-4 font-mono text-xs leading-relaxed ${
                isPassed
                  ? "bg-emerald-950/60 border-emerald-400 text-emerald-100"
                  : "bg-rose-950/60 border-rose-500 text-rose-100"
              }">
                <div class="font-extrabold uppercase mb-1 flex items-center gap-1.5">
                  <i data-lucide="${isPassed ? "BadgeCheck" : "AlertOctagon"}" class="w-4 h-4"></i>
                  <span>${
                    isPassed
                      ? "BIÊN BẢN NGHIỆM THU: ĐẠT YÊU CẦU KỸ THUẬT!"
                      : `CẢNH BÁO SAI SỐ — THÔNG SỐ ĐÚNG LÀ PHƯƠNG ÁN [${letters[ins.correctIndex]}]`
                  }</span>
                </div>
                <div class="font-sans text-xs sm:text-sm text-slate-200">${ins.explanation}</div>
              </div>
            `
            : "";

          return `
            <div class="p-4 sm:p-5 rounded-xl bg-slate-950/90 border-2 ${
              isAnswered
                ? isPassed
                  ? "border-emerald-500/60"
                  : "border-rose-500/60"
                : "border-slate-800"
            } space-y-3.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded-xs font-mono text-[11px] font-black bg-orange-600 text-white uppercase">
                    PHIẾU ${ins.code}
                  </span>
                  <span class="text-xs font-mono font-bold text-amber-400 uppercase">
                    // ${ins.context}
                  </span>
                </div>
                <span class="text-[11px] font-mono font-bold uppercase ${
                  isAnswered
                    ? isPassed
                      ? "text-emerald-400"
                      : "text-rose-400"
                    : "text-slate-500"
                }">
                  ${isAnswered ? (isPassed ? "● ĐÃ NGHIỆM THU ĐẠT" : "● CẦN HIỆU CHỈNH") : "○ CHỜ KIỂM ĐỊNH"}
                </span>
              </div>

              <div class="text-xs sm:text-sm font-medium text-white leading-relaxed">
                ${ins.question}
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${optionsHTML}
              </div>

              ${specExplanationHTML}
            </div>
          `;
        })
        .join("");

      // Stage Navigation Footer
      const prevStage = CONSTRUCTION_SITE_DATA.stages.find((s) => s.stageNumber === stage.stageNumber - 1);
      const nextStage = CONSTRUCTION_SITE_DATA.stages.find((s) => s.stageNumber === stage.stageNumber + 1);

      return `
        <div class="space-y-6">
          <!-- Stage Banner Header -->
          <section class="tech-card rounded-2xl border-2 border-amber-500/70 overflow-hidden shadow-xl">
            <div class="h-2 w-full hazard-stripe"></div>
            <div class="p-5 sm:p-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div class="space-y-1.5">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-xs font-mono text-xs font-black bg-amber-500 text-slate-950 uppercase">
                    ${stage.code}
                  </span>
                  <span class="text-xs font-mono font-bold text-sky-400 uppercase">
                    ${stage.sgkTitle}
                  </span>
                </div>
                <h2 class="text-xl sm:text-2xl font-black text-white uppercase tracking-tight">
                  Công đoạn ${stage.stageNumber}: ${stage.name}
                </h2>
                <p class="text-xs sm:text-sm text-slate-300">
                  ${stage.metaphor}
                </p>
              </div>

              <div class="flex items-center gap-3 shrink-0 bg-slate-950/90 px-4 py-2.5 rounded-xl border border-slate-800">
                <div>
                  <div class="text-[10px] font-mono uppercase text-slate-400">Trạng thái Công đoạn</div>
                  <div class="text-sm font-mono font-extrabold ${
                    stats.passed === stats.total ? "text-emerald-400" : "text-amber-400"
                  }">
                    ${stats.passed === stats.total ? "ĐẠT NGHIỆM THU 100%" : `ĐẠT ${stats.passed}/${stats.total} HẠNG MỤC`}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- =============================================================== -->
          <!-- KHU VỰC A: SƠ ĐỒ TƯ DUY RÚT GỌN (PHIẾU KIỂM ĐỊNH KỸ THUẬT)     -->
          <!-- =============================================================== -->
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded-xs font-mono text-xs font-black bg-sky-500 text-slate-950 uppercase">
                  KHU VỰC A
                </span>
                <h3 class="text-sm sm:text-base font-extrabold uppercase tracking-wide text-white">
                  Sơ đồ Tư duy Rút gọn — Phiếu Kiểm định Kỹ thuật (4 Thẻ Cốt lõi)
                </h3>
              </div>
              <span class="hidden sm:inline-block text-xs font-mono text-sky-400">
                [VISUAL FLOW CARDS • 1-LINE KATEX]
              </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${flowCardsHTML}
            </div>
          </section>

          <!-- =============================================================== -->
          <!-- KHU VỰC B: PHIẾU NGHIỆM THU HIỆN TRƯỜNG (THỬ THÁCH NHANH)       -->
          <!-- =============================================================== -->
          <section id="stage-inspection-section" class="tech-card rounded-2xl border-2 border-orange-500/60 p-5 sm:p-6 space-y-4 shadow-xl">
            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-dashed border-slate-700">
              <div class="flex items-center gap-2.5">
                <span class="px-2 py-0.5 rounded-xs font-mono text-xs font-black bg-orange-500 text-white uppercase">
                  KHU VỰC B
                </span>
                <div>
                  <h3 class="text-sm sm:text-base font-extrabold uppercase tracking-wide text-white">
                    Phiếu Nghiệm thu Hiện trường (Thử thách Trắc nghiệm Nhanh)
                  </h3>
                </div>
              </div>
              <span class="px-3 py-1 rounded-md font-mono text-xs font-bold bg-slate-950 border border-slate-800 text-amber-400">
                Kết quả: ${stats.passed}/${stats.total} Phiếu Đạt
              </span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              ${inspectionsHTML}
            </div>
          </section>

          <!-- Bottom Stage Pipeline Controls -->
          <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
            ${
              prevStage
                ? `<button
                     type="button"
                     onclick="switchSiteView('${prevStage.id}')"
                     class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-mono font-bold uppercase text-slate-200 transition flex items-center gap-2"
                   >
                     <i data-lucide="arrow-left" class="w-4 h-4 text-amber-400"></i>
                     <span>Lùi về Công đoạn ${prevStage.stageNumber}: ${prevStage.name}</span>
                   </button>`
                : `<button
                     type="button"
                     onclick="switchSiteView('master')"
                     class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-mono font-bold uppercase text-slate-200 transition flex items-center gap-2"
                   >
                     <i data-lucide="map" class="w-4 h-4 text-amber-400"></i>
                     <span>Về Sơ đồ Quy hoạch Tổng thể</span>
                   </button>`
            }

            ${
              nextStage
                ? `<button
                     type="button"
                     onclick="switchSiteView('${nextStage.id}')"
                     class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-mono font-black uppercase tracking-wider transition flex items-center gap-2 shadow-lg shadow-amber-500/20"
                   >
                     <span>Chuyển sang Công đoạn ${nextStage.stageNumber}: ${nextStage.name}</span>
                     <i data-lucide="arrow-right" class="w-4 h-4"></i>
                   </button>`
                : `<button
                     type="button"
                     onclick="switchSiteView('master')"
                     class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-mono font-black uppercase tracking-wider transition flex items-center gap-2 shadow-lg shadow-emerald-500/20"
                   >
                     <span>Hoàn tất • Về Bảng Tổng kết Công trình</span>
                     <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                   </button>`
            }
          </div>
        </div>
      `;
    }

    function submitInspection(stageId, qcCode, optionIndex) {
      const stage = CONSTRUCTION_SITE_DATA.stages.find((s) => s.id === stageId);
      if (!stage) return;
      const ins = stage.inspections.find((i) => i.code === qcCode);
      if (!ins) return;

      SITE_STATE.inspectionAnswers[qcCode] = optionIndex;
      safeSave("math12_site_inspections", SITE_STATE.inspectionAnswers);

      const passed = optionIndex === ins.correctIndex;
      playInspectionSound(passed);

      if (passed) {
        showSiteToast(`✓ PHIẾU ${qcCode}: NGHIỆM THU ĐẠT CHUẨN!`, "emerald");
      } else {
        showSiteToast(`✗ PHIẾU ${qcCode}: THÔNG SỐ CHƯA ĐẠT — XEM BẢNG GIẢI THÍCH`, "rose");
      }

      renderAll();
    }

    // =========================================================================
    // MASTER RENDER ORCHESTRATOR
    // =========================================================================
    function renderAll() {
      renderPipelineNav();
      const workspace = document.getElementById("main-workspace");
      if (!workspace) return;

      if (SITE_STATE.activeView === "master") {
        workspace.innerHTML = renderMasterBlueprintView();
      } else {
        const stage = CONSTRUCTION_SITE_DATA.stages.find((s) => s.id === SITE_STATE.activeView);
        if (stage) {
          workspace.innerHTML = renderStageDetailView(stage);
        }
      }

      renderIcons();
      renderMath(workspace);
    }

    window.addEventListener("DOMContentLoaded", () => {
      initSiteState();
      renderAll();
    });
  </script>
</body>
</html>
